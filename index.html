<!DOCTYPE html>
<html lang="th" data-theme="blue" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#003d9b">
  <meta name="description" content="ChowHuay Pro — แอปจัดการสต็อก ขาย และต้นทุน สำหรับร้านโชว์ห่วย">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ChowHuay Pro">
  <title>ChowHuay Pro — สต็อก &amp; ขาย</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://drive.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 24px; }
  </style>
</head>
<body>

  <!-- ============ PASSCODE LOCK ============ -->
  <div id="passcode-overlay" class="pin-screen">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <img src="icons/icon-192.png" alt="" style="width:44px;height:44px;border-radius:12px;">
      <h1 class="h2 text-primary">ChowHuay Pro</h1>
    </div>
    <div style="width:84px;height:84px;border-radius:50%;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--primary-fixed);">
      <span class="material-symbols-outlined text-primary" style="font-size:40px;">storefront</span>
    </div>
    <h2 class="title mt" style="margin-top:12px;">สวัสดีครับ คุณเจ้าของร้าน</h2>
    <p class="caption" style="margin-bottom:4px;">กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน</p>
    <div class="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="numpad">
      <button onclick="enterPin(1)">1</button><button onclick="enterPin(2)">2</button><button onclick="enterPin(3)">3</button>
      <button onclick="enterPin(4)">4</button><button onclick="enterPin(5)">5</button><button onclick="enterPin(6)">6</button>
      <button onclick="enterPin(7)">7</button><button onclick="enterPin(8)">8</button><button onclick="enterPin(9)">9</button>
      <div></div>
      <button onclick="enterPin(0)">0</button>
      <button class="icon-btn" onclick="deletePin()"><span class="material-symbols-outlined" style="font-size:30px;">backspace</span></button>
    </div>
    <input id="pin-quick" type="tel" inputmode="numeric" maxlength="4" class="hidden" autocomplete="off">
    <p class="caption mt" style="opacity:0.7;">รหัสผ่านเริ่มต้น 1234 · เปลี่ยนได้ที่เมนูตั้งค่า</p>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app-shell" class="hidden">
    <!-- TopAppBar -->
    <header class="app-topbar">
      <div class="brand">
        <img src="icons/icon-192.png" alt="">
        <span>ChowHuay Pro</span>
      </div>
      <div class="actions">
        <button class="topbar-btn" id="topbar-sync" title="ซิงก์ข้อมูล" aria-label="ซิงก์ข้อมูล">
          <span class="material-symbols-outlined">sync</span>
        </button>
        <button class="topbar-btn" data-route="settings" title="ตั้งค่า" aria-label="ตั้งค่า">
          <span class="avatar">U</span>
        </button>
      </div>
    </header>

    <!-- Desktop side nav -->
    <aside class="side-nav">
      <button class="nav-item" data-route="dashboard"><span class="material-symbols-outlined">dashboard</span><span>ภาพรวม</span></button>
      <button class="nav-item" data-route="pos"><span class="material-symbols-outlined">point_of_sale</span><span>ขาย</span></button>
      <button class="nav-item" data-route="inventory"><span class="material-symbols-outlined">inventory_2</span><span>สต็อก</span></button>
      <button class="nav-item" data-route="reports"><span class="material-symbols-outlined">assessment</span><span>รายงาน</span></button>
      <button class="nav-item" data-route="settings"><span class="material-symbols-outlined">settings</span><span>ตั้งค่า</span></button>
    </aside>

    <!-- Views -->
    <main class="app-main">
      <div id="view-dashboard" class="view"></div>
      <div id="view-pos" class="view"></div>
      <div id="view-inventory" class="view"></div>
      <div id="view-reports" class="view"></div>
      <div id="view-settings" class="view"></div>
    </main>

    <!-- Mobile bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-item" data-route="dashboard"><span class="material-symbols-outlined">dashboard</span><span>ภาพรวม</span></button>
      <button class="nav-item" data-route="pos"><span class="material-symbols-outlined">point_of_sale</span><span>ขาย</span></button>
      <button class="nav-item" data-route="inventory"><span class="material-symbols-outlined">inventory_2</span><span>สต็อก</span></button>
      <button class="nav-item" data-route="reports"><span class="material-symbols-outlined">assessment</span><span>รายงาน</span></button>
      <button class="nav-item" data-route="settings"><span class="material-symbols-outlined">settings</span><span>ตั้งค่า</span></button>
    </nav>
  </div>

  <!-- scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/pos.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
